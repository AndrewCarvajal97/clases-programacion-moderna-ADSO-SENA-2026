<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semántico ✅</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ✅ SEMÁNTICO: el MISMO contenido, pero con etiquetas que dicen QUÉ es cada cosa.
       El navegador las reconoce → la MISMA hoja de estilos ahora SÍ se aplica,
       y además los lectores de pantalla y Google entienden la página (landmarks). -->

  <header>
    <h1>Mi Blog</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Sobre mí</a>
    </nav>
  </header>

  <main>
    <article>
      <h2>Mi primer artículo</h2>
      <p><small>Publicado el 16 de agosto de 2026</small></p>
      <p>Este es el contenido del artículo. Fíjate: se ve <strong>con diseño</strong>,
        ¡y no cambiamos el CSS! Solo usamos las etiquetas correctas:
        &lt;header&gt;, &lt;nav&gt;, &lt;main&gt; y &lt;article&gt;.</p>
    </article>
  </main>

  <footer>© 2026 Mi Blog</footer>

</body>
</html>
