<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divididitis 🍝</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ❌ DIVIDIDITIS: TODO con <div>. El navegador no sabe qué es cada cosa,
       y la hoja de estilos (que selecciona header, nav, main…) NO se aplica. -->

  <div>
    <div>Mi Blog</div>
    <div>
      <div><a href="#">Inicio</a></div>
      <div><a href="#">Sobre mí</a></div>
    </div>
  </div>

  <div>
    <div>
      <div>Mi primer artículo</div>
      <div>Publicado el 16 de agosto de 2026</div>
      <div>Este es el contenido del artículo. Fíjate: se ve plano, sin diseño,
        porque el CSS busca &lt;header&gt;, &lt;nav&gt;, &lt;main&gt; y &lt;article&gt;… y aquí solo hay &lt;div&gt;.</div>
    </div>
  </div>

  <div>© 2026 Mi Blog</div>

</body>
</html>
